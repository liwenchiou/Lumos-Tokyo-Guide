<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mischief-Managed-Tokyo | Tokyo 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap');
        
        :root {
            --magic-gold: #d4af37;
            --wizard-crimson: #740001;
            --midnight: #0a0e1a;
            --parchment: #f4e4bc;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: var(--midnight);
            color: #e2e8f0;
            background-image: radial-gradient(circle at 50% 50%, #1a1b26 0%, #0a0e1a 100%);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .magic-font { font-family: 'Cinzel', serif; }

        .parchment-bg {
            background: #fdf5e6;
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            color: #2d241e;
        }

        .tab-active {
            background: var(--magic-gold) !important;
            color: var(--midnight) !important;
            box-shadow: 0 0 15px var(--magic-gold);
            transform: translateY(-2px);
        }

        .food-tab-active {
            border-bottom: 2px solid var(--wizard-crimson);
            color: var(--wizard-crimson);
            font-weight: bold;
        }

        .food-option-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1px dashed var(--magic-gold);
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .transport-tag {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--magic-gold);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            margin-top: 4px;
        }

        .deadline-pulse {
            animation: pulse-red 2s infinite;
            border: 2px solid #ef4444;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <header class="relative pt-12 pb-20 px-6 text-center overflow-hidden">
        <div class="relative z-10 max-w-xl mx-auto">
            <div class="inline-block px-4 py-1 border border-magic-gold rounded-full text-[10px] tracking-[0.3em] text-magic-gold uppercase mb-6 animate-pulse">
                Mischief Managed
            </div>
            <h1 class="magic-font text-5xl font-bold text-white mb-4 drop-shadow-[0_0_15px_rgba(212,175,55,0.6)] text-center tracking-tighter">TOKYO 2026</h1>
            
            <div class="mt-8 grid grid-cols-2 gap-4 text-left">
                <div class="p-4 bg-white/5 border border-magic-gold/30 rounded-2xl backdrop-blur-md">
                    <div class="magic-font text-[9px] text-magic-gold mb-1 uppercase text-center">Departure ✈ JX800</div>
                    <div class="text-xl font-bold text-white text-center">10:40 <span class="text-xs opacity-50 mx-1">→</span> 15:05</div>
                    <div class="text-[9px] text-white/50 text-center mt-1 uppercase tracking-widest text-center">TPE - NRT</div>
                </div>
                <div class="p-4 bg-white/5 border border-magic-gold/30 rounded-2xl backdrop-blur-md">
                    <div class="magic-font text-[9px] text-magic-gold mb-1 uppercase text-center">Return ✈ JX801</div>
                    <div class="text-xl font-bold text-white text-center">14:10 <span class="text-xs opacity-50 mx-1">→</span> 16:40</div>
                    <div class="text-[9px] text-white/50 text-center mt-1 uppercase tracking-widest text-center">NRT - TPE</div>
                </div>
            </div>
        </div>
    </header>

    <nav class="max-w-xl mx-auto -mt-10 px-4 sticky top-4 z-50">
        <div class="bg-midnight/90 backdrop-blur-2xl p-2 rounded-2xl shadow-2xl flex flex-col gap-2 border border-magic-gold/20">
            <div class="flex gap-2">
                <button onclick="toggleMainTab('map')" id="main-btn-map" class="flex-1 py-3 rounded-xl text-center transition-all border border-magic-gold/20 font-bold text-sm magic-font tab-active">
                    <i data-lucide="map" class="inline w-4 h-4 mr-2 mb-1"></i>魔法地圖
                </button>
                <button onclick="toggleMainTab('checklist')" id="main-btn-checklist" class="flex-1 py-3 rounded-xl text-center transition-all border border-magic-gold/20 font-bold text-sm magic-font">
                    <i data-lucide="scroll" class="inline w-4 h-4 mr-2 mb-1"></i>準備清單
                </button>
            </div>
            <div id="day-selector" class="flex justify-between gap-1 mt-1 border-t border-white/10 pt-2 overflow-x-auto no-scrollbar">
                <!-- Days injected by JS -->
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto mt-10 px-6">
        <div id="content-itinerary" class="block">
            <!-- Day itinerary will appear here -->
        </div>

        <div id="content-checklist" class="hidden">
            <div class="parchment-bg p-8 rounded-[2rem] shadow-2xl relative overflow-hidden">
                <h3 class="magic-font text-2xl font-bold mb-6 text-black/80 flex items-center">
                    <i data-lucide="feather" class="w-6 h-6 mr-3 text-wizard-crimson"></i>
                    入學必備清單
                </h3>
                <div id="checklist-items" class="space-y-4">
                    <!-- Checklist injected by JS -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const itineraryData = {
            1: {
                date: "5.25 Mon",

                items: [
                    { time: "08:10", activity: "桃園機場報到", icon: "plane", note: "【星宇 JX800】第一航廈。建議提早抵達享受貴賓室或逛逛機場。", transport: "桃園機場 T1", coords: "25.0792,121.2342", critical: true },
                    { time: "10:40", activity: "起飛：桃園 TPE", icon: "plane-takeoff", note: "準備享受胡同燒肉機上餐與星宇魔法飛行。", transport: "StarLux JX800", coords: "25.0792,121.2342" },
                    { time: "15:05", activity: "抵達成田機場 NRT", icon: "landing-gear", note: "抵達成田 T2。辦理 VJW 入境。搭乘 Skyliner 直達京成上野站。", transport: "NRT Terminal 2", coords: "35.7722,140.3876" },
                    { time: "17:30", activity: "新御徒町 Check-in", icon: "home", note: "搭乘「大江戶線」一站抵達。放下行李準備開吃！", transport: "京成上野 → 大江戶線 → 新御徒町", coords: "35.7054,139.7835" }
                ],
                food: {
                    breakfast: [{ name: "TPE 貴賓室/輕食", note: "機場內星巴克或 T1 輕食區。", coords: "25.0792,121.2342" }],
                    lunch: [{ name: "星宇機上餐", note: "胡同燒肉聯名餐，必喝星宇特調。", coords: "25.0792,121.2342" }],
                    dinner: [

                        { name: "肉屋橫丁", note: "秋葉原店，豪華和牛燒肉吃到飽。", coords: "35.6985,139.7731" }

            },

                items: [

                    { time: "10:30", activity: "哈利波特影城", icon: "castle", note: "【九又四分之三月台】沉浸式魔法體驗。建議預留 4 小時。", transport: "豐島園站徒步 2 分", coords: "35.7454,139.6481" },
                    { time: "18:00", activity: "新宿夜巡", icon: "sparkles", note: "回程搭大江戶線在新宿下車，看 3D 貓與新宿繁華夜景。", transport: "都營大江戶線", coords: "35.6905,139.7005" }
                ],

                    lunch: [{ name: "Backlot Cafe", note: "影城內必喝奶油啤酒與學院主題餐。", coords: "35.7454,139.6481" }],
                    dinner: [
                        { name: "六歌仙 燒肉", note: "新宿頂級和牛，需預約。", coords: "35.6925,139.6991" },
                        { name: "風雲兒 拉麵", note: "新宿超人氣沾麵，湯頭極濃郁。", coords: "35.6874,139.6981" }
                    ]
                }
            },
            3: {
                date: "5.27 Wed",
                title: "城市之巔與潮流",
                items: [
                    { time: "10:00", activity: "明治神宮", icon: "tree-pine", note: "搭乘 JR 總武線直達代代木，參拜壯麗鳥居。", transport: "新御徒町 → JR 總武線 → 代代木", coords: "35.6764,139.6993" },
                    { time: "14:00", activity: "原宿 & 表參道", icon: "shopping-cart", note: "逛潮流店、竹下通，感受日本最尖端流行。", transport: "步行", coords: "35.6705,139.7031" },
                    { time: "18:00", activity: "SHIBUYA SKY", icon: "cloud-sun", note: "預約夕陽時段俯瞰東京全景，預約 18:00 最美。", transport: "JR 山手線", coords: "35.6585,139.7023" }
                ],
                food: {
                    breakfast: [{ name: "Bills 表參道", note: "世界第一鬆餅，需預約或早點排隊。", coords: "35.6687,139.7055" }],
                    lunch: [{ name: "阿夫利 柚子拉麵", note: "原宿站旁，清爽系首選。", coords: "35.6705,139.7031" }],
                    dinner: [
                        { name: "敘敘苑 澀谷", note: "38樓高空夜景與高級燒肉。", coords: "35.6595,139.7003" },
                        { name: "極味屋 漢堡排", note: "澀谷 PARCO 店，自己煎的樂趣。", coords: "35.6620,139.6991" }
                    ]
                }
            },
            4: {
                date: "5.28 Thu",
                title: "海景、鋼彈與老街",
                items: [
                    { time: "09:00", activity: "築地市場", icon: "fish", note: "大江戶線直達。大啖新鮮海鮮丼與玉子燒。", transport: "新御徒町 → 大江戶線 → 築地市場", coords: "35.6655,139.7707" },
                    { time: "14:00", activity: "淺草雷門", icon: "map-pin", note: "搭乘淺草線抵達，參拜後步行至碼頭。", transport: "都營淺草線", coords: "35.7148,139.7967" },
                    { time: "16:30", activity: "水上巴士前往台場", icon: "ship", note: "搭乘未來感船隻 Himiko/Hotaluna 前往台場。", transport: "淺草碼頭 → 水上巴士 → 台場", coords: "35.6246,139.7755" },
                    { time: "18:00", activity: "台場：獨角獸鋼彈", icon: "zap", note: "看鋼彈表演、彩虹大橋夜景、購物中心。", transport: "台場海濱公園", coords: "35.6246,139.7755" }
                ],
                food: {
                    breakfast: [{ name: "築地 虎杖", note: "豪華海鮮珠寶盒，視覺味覺享受。", coords: "35.6655,139.7707" }],
                    lunch: [{ name: "淺草 今半", note: "百年壽喜燒老店，午餐時段較划算。", coords: "35.7121,139.7925" }],
                    dinner: [
                        { name: "台場 Bills", note: "彩虹大橋海景餐，氛圍無敵。", coords: "35.6288,139.7744" },
                        { name: "和幸豬排 台場", note: "CP值超高的炸豬排連鎖店。", coords: "35.6268,139.7755" }
                    ]
                }
            },
            5: {
                date: "5.29 Fri",
                title: "最後掃貨與歸途",
                items: [
                    { time: "09:30", activity: "最後掃貨：多慶屋", icon: "shopping-bag", note: "飯店旁紫色大樓，最後採買藥妝零食。", transport: "步行 10 分鐘", coords: "35.7073,139.7753" },
                    { time: "11:00", activity: "前往成田：Skyliner", icon: "train", note: "務必搭上此班，預計 11:45 抵達成田 T2。", transport: "京成上野 → Skyliner", coords: "35.7124,139.7761" },
                    { time: "11:45", activity: "星宇報到 (成田 T2)", icon: "check-circle", note: "【重要】起飛前 2.5 小時抵達，留時間逛免稅店。", transport: "成田 T2", coords: "35.7722,140.3876", critical: true },
                    { time: "14:10", activity: "起飛：成田 NRT", icon: "plane-takeoff", note: "星宇 JX801。帶著滿滿魔法戰利品回台灣。", transport: "StarLux JX801", coords: "35.7722,140.3876" },
                    { time: "16:40", activity: "抵達：桃園 TPE", icon: "landing-gear", note: "平安抵達台灣，魔法旅程圓滿結束。", transport: "TPE Terminal 1", coords: "25.0792,121.2342" }
                ],
                food: {
                    breakfast: [{ name: "MISOJYU 淺草", note: "精緻味噌湯早餐，溫暖你的胃。", coords: "35.7115,139.7941" }],
                    lunch: [{ name: "成田機場免稅區", note: "最後一碗日式拉麵或伴手禮區輕食。", coords: "35.7722,140.3876" }],
                    dinner: [{ name: "台灣想念的味道", note: "溫暖的家與台灣美食。", coords: "25.0792,121.2342" }]
                }
            }
        };

        const checklistData = [
            { text: "護照與 VJW QR Code 截圖", critical: true },
            { text: "星宇航空電子登機證 (APP)", critical: true },
            { text: "哈利波特影城電子門票", critical: true },
            { text: "SHIBUYA SKY 預約憑證", critical: true },
            { text: "水上巴士預約憑證", critical: false },
            { text: "日本 ESIM / 實體網卡", critical: true },
            { text: "Apple Wallet 綁定 Suica", critical: false },
            { text: "哈利波特學院袍/魔法棒 (如有)", critical: false }
        ];

        let currentDayCoords = "35.7054,139.7835";

        function initDayNav() {
            const container = document.getElementById('day-selector');
            container.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const btn = document.createElement('button');
                btn.id = `btn-day-${i}`;
                btn.className = 'px-4 py-2 rounded-lg text-[10px] magic-font border border-white/10 transition-all flex-shrink-0';
                btn.innerText = `DAY ${i}`;
                btn.onclick = () => switchDay(i);
                container.appendChild(btn);
            }
        }

        function switchDay(day) {
            document.querySelectorAll('#day-selector button').forEach(b => b.classList.remove('tab-active'));
            const activeBtn = document.getElementById(`btn-day-${day}`);
            if (activeBtn) activeBtn.classList.add('tab-active');
            renderItinerary(day);
            window.scrollTo({ top: 250, behavior: 'smooth' });
        }

        function toggleMainTab(tab) {
            const mapBtn = document.getElementById('main-btn-map');
            const listBtn = document.getElementById('main-btn-checklist');
            const itineraryCont = document.getElementById('content-itinerary');
            const checklistCont = document.getElementById('content-checklist');
            const daySelector = document.getElementById('day-selector');

            if (tab === 'map') {
                mapBtn.classList.add('tab-active');
                listBtn.classList.remove('tab-active');
                itineraryCont.classList.remove('hidden');
                daySelector.classList.remove('hidden');
                checklistCont.classList.add('hidden');
            } else {
                listBtn.classList.add('tab-active');
                mapBtn.classList.remove('tab-active');
                checklistCont.classList.remove('hidden');
                itineraryCont.classList.add('hidden');
                daySelector.classList.add('hidden');
                renderChecklist();
            }
        }

        function renderItinerary(day) {
            const data = itineraryData[day];
            const container = document.getElementById('content-itinerary');
            window.currentDayFood = data.food;
            currentDayCoords = data.items[0].coords;

            let html = `<div class="animate__animated animate__fadeIn">
                <div class="flex items-center justify-between mb-8 border-b border-magic-gold/30 pb-4">
                    <h2 class="magic-font text-2xl font-bold text-white tracking-widest">${data.title}</h2>
                    <span class="magic-font text-sm text-magic-gold/70">${data.date}</span>
                </div>`;

            data.items.forEach(item => {
                const isCritical = item.critical ? 'deadline-pulse' : '';
                html += `
                    <div class="mb-10 flex items-start">
                        <div class="w-10 h-10 bg-magic-gold text-midnight rounded-xl flex items-center justify-center mr-4 shadow-lg flex-shrink-0">
                            <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                        </div>
                        <div class="flex-1">
                            <div class="magic-font text-[10px] text-magic-gold font-bold uppercase tracking-widest mb-1">${item.time}</div>
                            <h4 class="font-bold text-white text-lg mb-1">${item.activity}</h4>
                            <div class="transport-tag mb-2">
                                <i data-lucide="train" class="w-3 h-3 mr-1"></i> ${item.transport}
                            </div>
                            <div class="border border-white/10 bg-white/5 p-4 rounded-xl backdrop-blur-sm ${isCritical}">
                                <p class="text-sm text-slate-300 leading-relaxed font-light mb-4">${item.note}</p>
                                <button onclick="openNav('${item.coords}')" class="w-full py-2 bg-white/10 border border-magic-gold/30 rounded-lg flex items-center justify-center font-bold text-[10px] tracking-widest text-magic-gold uppercase">
                                    <i data-lucide="navigation" class="w-3 h-3 mr-2"></i> 路徑顯現
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="parchment-bg p-6 rounded-[2rem] shadow-2xl mt-12 mb-20 border-4 border-magic-gold/20">
                    <h3 class="magic-font text-xl font-bold mb-4 text-black/80 flex items-center justify-center">
                        <i data-lucide="utensils" class="w-5 h-5 mr-2 text-wizard-crimson"></i>
                        THE GREAT HALL MENU
                    </h3>
                    <div class="flex justify-around mb-6 border-b border-black/10">
                        <button onclick="switchMeal(event, 'breakfast')" class="meal-tab pb-2 food-tab-active flex-1 text-sm">🍳 朝食</button>
                        <button onclick="switchMeal(event, 'lunch')" class="meal-tab pb-2 text-gray-400 flex-1 text-sm">🍖 午餐</button>
                        <button onclick="switchMeal(event, 'dinner')" class="meal-tab pb-2 text-gray-400 flex-1 text-sm">🍷 晚宴</button>
                    </div>
                    <div id="meal-content" class="space-y-4 min-h-[150px]">
                        ${renderMealOptions(data.food.breakfast)}
                    </div>
                    <div class="mt-6 pt-4 border-t border-black/10">
                        <button onclick="searchNearby()" class="w-full py-3 bg-midnight text-magic-gold rounded-xl flex items-center justify-center font-bold text-xs uppercase tracking-widest shadow-xl border border-magic-gold/50">
                            <i data-lucide="search" class="w-4 h-4 mr-2"></i> 🔍 顯現周邊美食
                        </button>
                    </div>
                </div>
            </div>`;
            
            container.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        }

        function renderMealOptions(options) {
            return options.map(opt => `
                <div class="food-option-card p-4 rounded-xl">
                    <h5 class="font-bold text-black/80 mb-1">${opt.name}</h5>
                    <p class="text-xs text-black/60 mb-3">${opt.note}</p>
                    <button onclick="openNav('${opt.coords}')" class="text-[9px] font-bold text-wizard-crimson border-b border-wizard-crimson/30 pb-0.5">
                        <i data-lucide="map-pin" class="inline w-3 h-3 mr-1"></i> 查看位置
                    </button>
                </div>
            `).join('');
        }

        function switchMeal(event, type) {
            document.querySelectorAll('.meal-tab').forEach(b => {
                b.classList.remove('food-tab-active');
                b.classList.add('text-gray-400');
            });
            event.target.classList.add('food-tab-active');
            event.target.classList.remove('text-gray-400');
            document.getElementById('meal-content').innerHTML = renderMealOptions(window.currentDayFood[type]);
            if (window.lucide) lucide.createIcons();
        }

        function renderChecklist() {
            const container = document.getElementById('checklist-items');
            container.innerHTML = checklistData.map(item => `
                <div class="flex items-center p-4 rounded-2xl border border-black/5 bg-black/5 group cursor-pointer" onclick="this.classList.toggle('opacity-30')">
                    <div class="w-6 h-6 rounded-lg border-2 border-wizard-crimson/30 mr-4 flex items-center justify-center">
                        <i data-lucide="check" class="w-4 h-4 text-wizard-crimson opacity-0 group-active:opacity-100"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <span class="text-sm font-bold text-black/80">${item.text}</span>
                        ${item.critical ? '<div class="text-[8px] text-wizard-crimson font-bold uppercase mt-1 font-bold tracking-widest">Priority: Critical</div>' : ''}
                    </div>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

        function openNav(coords) {
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${coords}`, '_blank');
        }

        function searchNearby() {
            window.open(`https://www.google.com/maps/search/餐廳/@${currentDayCoords},15z`, '_blank');
        }

        window.onload = () => {
            initDayNav();
            toggleMainTab('map');
            switchDay(1);
            
            // Magic sparkle effect
            setInterval(() => {
                const s = document.createElement('div');
                s.style.position = 'fixed';
                s.style.width = '2px';
                s.style.height = '2px';
                s.style.background = 'white';
                s.style.borderRadius = '50%';
                s.style.pointerEvents = 'none';
                s.style.left = Math.random() * 100 + 'vw';
                s.style.top = (window.innerHeight + window.scrollY) + 'px';
                s.style.opacity = '0.5';
                s.style.transition = 'all 2s linear';
                document.body.appendChild(s);
                setTimeout(() => {
                    s.style.transform = `translateY(-200px)`;
                    s.style.opacity = '0';
                    setTimeout(() => s.remove(), 2000);
                }, 100);
            }, 300);
        };
    </script>
</body>
</html>
